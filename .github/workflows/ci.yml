name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# Superseded runs on the same ref are wasted work; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas a PR touches, to decide whether the heavy end-to-end jobs are
  # worth running. `main` pushes ignore this and always run the full suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'crates/**'
              - 'src-ui/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'

  # Build + test the frontend once; every later job reuses dist/ instead of
  # reinstalling and rebuilding it in each job.
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci
        working-directory: src-ui
      - run: npm test
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
      - uses: actions/upload-artifact@v6
        with:
          name: ui-dist
          path: src-ui/dist
          if-no-files-found: error

  # Rust workspace tests (always), plus the native Tauri/WebKit PTY smoke
  # (on `main`, or on a PR that touches native/UI paths), off one cached
  # build. Previously two separate uncached Rust jobs.
  rust:
    needs: [build-ui, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-linux
      - uses: actions/download-artifact@v6
        with:
          name: ui-dist
          path: src-ui/dist
      - name: Install Tauri system deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev build-essential
      - run: cargo test --workspace --locked
      - name: Install virtual-display dependencies
        if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
        run: sudo apt-get install -y xvfb xauth imagemagick
      - name: Build shell, worker, and notify for the PTY smoke
        if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
        run: cargo build --locked -p muis-shell -p muis-worker -p muis-notify -p muis-agent
      - name: Run native Tauri PTY smoke under Xvfb
        if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
        run: bash tests/e2e/live-x11.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: muis-native-xvfb
          path: tests/e2e/artifacts/live-x11/

  # The Windows path is browser mode only, so it is the same crates on a
  # different target: type-check them so the cfg(windows) shims cannot rot.
  windows-check:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-windows
      - uses: actions/download-artifact@v6
        with:
          name: ui-dist
          path: src-ui/dist
      - run: >
          cargo check --locked --target x86_64-pc-windows-gnu
          -p muis-core -p muis-worker -p muis-notify -p muis-agent -p muis-server

  # The JavaScript host is the fallback for machines that refuse to start
  # freshly compiled binaries; it must stay green even though it is not the
  # artifact we ship on Linux.
  node-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node-host/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: npm ci
        working-directory: node-host
      - run: npm test
        working-directory: node-host

  # Both browser hosts must answer one protocol. Run the same contract tests
  # against the Rust binary and the Node script so neither can drift silently.
  parity:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-parity
      - uses: actions/download-artifact@v6
        with:
          name: ui-dist
          path: src-ui/dist
      - run: cargo build -p muis-server
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/parity/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      # The Node host imports node-pty, which builds from source on Linux.
      - run: npm ci
        working-directory: node-host
      - run: npm ci
        working-directory: tests/parity
      - name: Run the same contract tests against both hosts
        working-directory: tests/parity
        env:
          MUIS_RUST_BIN: ${{ github.workspace }}/target/debug/muis-server
        run: npm test

  browser-e2e:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - uses: actions/download-artifact@v6
        with:
          name: ui-dist
          path: src-ui/dist
      - run: npm ci
        working-directory: tests/e2e
      - name: Run Selenium browser interactions
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MUIS_URL: http://127.0.0.1:4173
          SHOTS_DIR: ${{ github.workspace }}/tests/e2e/artifacts/browser
        run: |
          python3 -m http.server 4173 --directory src-ui/dist > /tmp/muis-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS "$MUIS_URL/" >/dev/null && break
            sleep 1
          done
          npm test --prefix tests/e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: muis-browser-e2e
          path: tests/e2e/artifacts/browser/
