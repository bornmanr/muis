name: tag-release

# Runs after a green main CI. When `tauri.conf.json` carries a version that
# has no release yet, it dispatches the release workflow for exactly that
# version. Dispatch is used because a tag pushed with `GITHUB_TOKEN` would not
# start another workflow run.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish an unreleased version
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Release when the version has no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import json;print(json.load(open('crates/muis-shell/tauri.conf.json'))['version'])")"
          tag="v${version}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} is already released; nothing to do."
            exit 0
          fi

          echo "Dispatching the release workflow for ${tag}."
          gh workflow run release.yml --ref main -f "version=${version}"
