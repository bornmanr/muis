[package]
name = "muis-agent"
version = "0.1.0"
edition = "2021"
description = "Report the active agent session to a running muis window"

[lib]
name = "muis_agent"
path = "src/lib.rs"

[[bin]]
name = "muis-agent"
path = "src/main.rs"

[[bin]]
name = "muis-mcp"
path = "src/bin/muis-mcp.rs"

[dependencies]
muis-core = { path = "../muis-core" }
muis-daemon = { path = "../muis-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
